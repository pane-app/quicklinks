[package]
name = "quicklinks"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pane's Rust SDK. It is not on crates.io yet (pane-app/pane#281); until it
# is, CI patches this dependency to the pane-extension folder of the Pane
# checkout it pins (see .github/workflows/ci.yml), and a local build can
# patch it the same way.
pane-extension = "0.1"
# Import and Export Quicklinks read and write JSON; the edit and duplicate
# launch contexts are JSON too.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# As Pane's own guests workspace builds its components: a small component,
# with no unwinding to carry into the WebAssembly component.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
