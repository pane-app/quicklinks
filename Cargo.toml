[package]
name = "quicklinks"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pane's Rust SDK, from crates.io.
pane-extension = "0.2"
# Import and Export Quicklinks read and write JSON; the edit and duplicate
# launch contexts are JSON too.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# As Pane's own guests workspace builds its components: a small component,
# with no unwinding to carry into the WebAssembly component.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
